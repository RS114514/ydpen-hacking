touch_disableedit
touch_removeall
touch_aspectratio 0.2770833333
touch_safearea 0
touch_config_file "touch.cfg"
touch_setclientonly 0
touch_grid_enable 0
touch_pitch 45
touch_yaw 60
touch_forwardzone 0.16
touch_sidezone 0.055
touch_move_indicator 0
touch_dpad_radius 1.0

-duck 71
-duck 72
-jump 72
-jump 73
-forward
-back
-moveleft
-moveright

// ===================== 右侧与全局视角区 (0.48..1.0) =====================
// 底层滑动视角区域，限制在右半屏，隔离左手移动区；先于操作按键添加，使操作按键享有更高倒序优先权
touch_addbutton "look" "" "_look" 0.480000 0.000000 1.000000 1.000000 255 255 255 0 0 0

// ===================== 左手区：连续比例舒适虚拟摇杆 (Joystick, 168x168 像素，偏下防遮挡) =====================
// 原生模拟量 _joy：168x168 像素比例摇杆，支持连续无级模拟量移动，标志位 2048 (TOUCH_FL_STICK)
touch_addbutton "joy" "gfx/touch/stick_ring" "_joy" 0.030000 0.228421 0.205000 0.860000 255 255 255 220 2048 0

// 左手辅助按键 (54x54 像素)：下蹲锁存 (4096) + 向前大跳宏
touch_addbutton "crouch" "gfx/touch/crouch" "+duck 71" 0.245000 0.020000 0.301250 0.223008 255 255 255 200 4096 0
touch_addbutton "cjump" "gfx/touch/dpad_cjump" "+cjump" 0.320000 0.020000 0.376250 0.223008 120 250 180 220 0 0

// ===================== 顶部居中工具栏 (40x40 像素) =====================
touch_addbutton "quicksave" "gfx/touch/save" "save quick" 0.490000 0.015000 0.531667 0.165376 255 255 255 170 0 0
touch_addbutton "quickload" "gfx/touch/load" "load quick" 0.540000 0.015000 0.581667 0.165376 255 255 255 170 0 0
touch_addbutton "show_numbers" "gfx/touch/weapons" "exec touch_numbers.cfg" 0.590000 0.015000 0.631667 0.165376 255 255 255 170 0 0
touch_addbutton "flashlight" "gfx/touch/flashlight" "impulse 100" 0.640000 0.015000 0.681667 0.165376 255 255 255 170 0 0
touch_addbutton "menu" "gfx/touch/menu" "cancelselect" 0.690000 0.015000 0.731667 0.165376 255 255 255 170 0 0
touch_addbutton "prev" "gfx/touch/prev" "invprev" 0.740000 0.015000 0.781667 0.165376 255 255 255 160 0 0
touch_addbutton "next" "gfx/touch/next" "invnext" 0.790000 0.015000 0.831667 0.165376 255 255 255 160 0 0

// ===================== 右侧核心战斗与交互操作按键 (超大尺寸，正方形) =====================
// 换弹夹与副开火 (80x80 像素)
touch_addbutton "reload" "gfx/touch/reload" "+reload" 0.600000 0.180000 0.683333 0.480752 255 255 255 190 0 0
touch_addbutton "alt_fire" "gfx/touch/alt_fire" "+attack2" 0.600000 0.499248 0.683333 0.800000 255 255 255 190 0 0

// 主开火键 (超大 106x106 像素，拇指核心落点)
touch_addbutton "fire" "gfx/touch/fire" "+attack" 0.710000 0.400000 0.820417 0.798496 255 255 255 220 0 0

// 跳跃与使用/交互键 (大尺寸 96x96 像素)
touch_addbutton "jump" "gfx/touch/jump" "+jump 73" 0.855000 0.030000 0.955000 0.390902 255 255 255 220 0 0
touch_addbutton "use" "gfx/touch/use" "+use" 0.855000 0.439098 0.955000 0.800000 255 255 255 210 0 0
