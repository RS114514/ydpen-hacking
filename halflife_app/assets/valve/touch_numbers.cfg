touch_removebutton "_numbers_*"
touch_hide quicksave
touch_hide quickload
touch_hide show_numbers
touch_hide flashlight
touch_hide menu
touch_hide prev
touch_hide next
alias _numbers_clean "touch_removebutton _numbers_*; touch_show quicksave; touch_show quickload; touch_show show_numbers; touch_show flashlight; touch_show menu; touch_show prev; touch_show next"
touch_addbutton "_numbers_slot1" "touch_default/key_1" "slot1; _numbers_clean" 0.260000 0.030000 0.325000 0.230000 255 255 255 220 0 0
touch_addbutton "_numbers_slot2" "touch_default/key_2" "slot2; _numbers_clean" 0.335000 0.030000 0.400000 0.230000 255 255 255 220 0 0
touch_addbutton "_numbers_slot3" "touch_default/key_3" "slot3; _numbers_clean" 0.410000 0.030000 0.475000 0.230000 255 255 255 220 0 0
touch_addbutton "_numbers_slot4" "touch_default/key_4" "slot4; _numbers_clean" 0.485000 0.030000 0.550000 0.230000 255 255 255 220 0 0
touch_addbutton "_numbers_slot5" "touch_default/key_5" "slot5; _numbers_clean" 0.560000 0.030000 0.625000 0.230000 255 255 255 220 0 0
touch_addbutton "_numbers_close" "touch_default/edit_close" "_numbers_clean" 0.640000 0.030000 0.705000 0.230000 255 255 255 220 0 0
