xrcon_address "127.0.0.1:27000"
xrcon_enable 1
touch_enable 1
touch_config_file "touch.cfg"
m_forward 0
m_side 0
lookstrafe 0
m_ignore 1
+mlook
crosshair 1
hud_fastswitch 1
default_fov 90
r_dynamic 0
gl_overbright 0
alias +cjump "+forward; +jump 72; wait; +duck 72"
alias -cjump "-jump 72; -duck 72; -forward"
exec touch.cfg
