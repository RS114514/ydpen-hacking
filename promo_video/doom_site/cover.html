<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#070405;color:#fff;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
#bg{position:absolute;inset:-10%;background:radial-gradient(ellipse at 50% 38%,#4a1408 0%,#180709 48%,#070405 100%)}
#glow{position:absolute;left:50%;top:54%;width:1500px;height:900px;transform:translate(-50%,-50%);background:radial-gradient(ellipse,rgba(255,60,0,.3),rgba(255,60,0,0) 65%);filter:blur(80px)}
#grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,70,20,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,70,20,.07) 1px,transparent 1px);background-size:120px 120px;opacity:.6}
#scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.15) 0 1px,transparent 1px 3px);opacity:.35}
#vig{position:absolute;inset:0;box-shadow:inset 0 0 220px rgba(0,0,0,.9)}
.badge{position:absolute;left:50%;top:92px;transform:translateX(-50%);padding:8px 46px;border-radius:14px;background:linear-gradient(135deg,#ff2a00,#a30000);box-shadow:0 0 60px rgba(255,40,0,.7);border:2px solid rgba(255,200,150,.4)}
.badge span{font-family:Impact,"Arial Black",sans-serif;font-size:82px;letter-spacing:5px;text-shadow:0 0 24px rgba(0,0,0,.35)}
.title{position:absolute;left:0;right:0;top:222px;text-align:center;font-family:Impact,"Arial Black","PingFang SC",sans-serif;font-size:112px;font-weight:900;letter-spacing:5px;text-shadow:0 0 30px rgba(255,60,0,.6),0 8px 30px #000}
.sub{position:absolute;left:0;right:0;top:360px;text-align:center;font-size:38px;font-weight:600;letter-spacing:12px;color:#ffc9a6;text-shadow:0 4px 18px #000}
.pen{position:absolute;left:50%;top:470px;transform:translateX(-50%);width:1500px;height:446px;border-radius:223px;background:linear-gradient(180deg,#2b2e36 0%,#17191f 48%,#0a0b0e 100%);box-shadow:0 60px 120px rgba(0,0,0,.85),inset 0 4px 6px rgba(255,255,255,.14),inset 0 -8px 14px rgba(0,0,0,.75),0 0 0 2px rgba(255,80,20,.2),0 0 120px rgba(255,50,0,.25)}
.screen{position:absolute;left:161px;top:42px;width:1178px;height:327px;border-radius:20px;overflow:hidden;background:#000;box-shadow:0 0 0 9px #0b0c0f,0 0 0 11px #3a3d46,0 0 44px rgba(255,70,20,.3)}
.screen img{width:100%;height:100%;object-fit:cover;display:block}
.glare{position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.13) 0%,rgba(255,255,255,0) 38%)}
.led{position:absolute;left:78px;top:158px;width:15px;height:15px;border-radius:50%;background:#ff4a1c;box-shadow:0 0 18px #ff4a1c,0 0 44px rgba(255,74,28,.65)}
.tip{position:absolute;right:-34px;top:150px;width:110px;height:146px;border-radius:0 73px 73px 0;background:linear-gradient(180deg,#2b2b30,#0d0d10)}
.strip{position:absolute;left:150px;right:150px;bottom:7px;height:3px;border-radius:2px;background:linear-gradient(90deg,transparent,#ff4a1c 25%,#ffb347 50%,#ff4a1c 75%,transparent);opacity:.7}
.foot{position:absolute;right:64px;bottom:38px;font-family:Menlo,monospace;font-size:30px;font-weight:700;letter-spacing:4px;color:#ffb37a;text-shadow:0 0 18px rgba(255,60,0,.5)}
.foot small{display:block;font-family:"PingFang SC";font-size:20px;font-weight:500;letter-spacing:6px;color:#bba8b4;text-align:right;margin-top:4px}
</style>
</head>
<body>
  <div id="bg"></div>
  <div id="grid"></div>
  <div id="glow"></div>
  <div id="scan"></div>
  <div id="vig"></div>

  <div class="badge"><span>RUNS DOOM!</span></div>
  <div class="title">把 DOOM 装进词典笔</div>
  <div class="sub">960 × 266 超宽屏 · 真机 60FPS · 工具链开源</div>
  <div class="pen">
    <div class="led"></div><div class="tip"></div><div class="strip"></div>
    <div class="screen"><img src="a/03_pool_view.png"><div class="glare"></div></div>
  </div>
  <div class="foot">RS_TV<small>有道词典笔 · 实机演示</small></div>
</body>
</html>
